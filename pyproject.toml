[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "media-eyes"
version = "0.1.0"
description = "Give AI agents eyes and ears: timestamped video frames, audio clips and transcripts over MCP."
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Bowie", email = "bowie@wanaka.com"}]
keywords = ["mcp", "video", "audio", "claude", "agent", "youtube", "ffmpeg"]
dependencies = ["mcp>=1.20,<2", "yt-dlp>=2025.1"]

[project.optional-dependencies]
transcription = ["faster-whisper>=1.2,<2"]
dev = ["pytest>=8", "ruff>=0.12"]

[project.scripts]
media-eyes = "media_eyes.server:main"

[project.urls]
Homepage = "https://github.com/MajorTomLeee/media-eyes"
Issues = "https://github.com/MajorTomLeee/media-eyes/issues"

[tool.ruff]
line-length = 100
